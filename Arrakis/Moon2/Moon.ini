[Rainmeter]
; Positioned once a minute by the Sky skin. Click to start or stop a focus session.
Update=-1
Group=Arrakis
OnRefreshAction=[!CommandMeasure mSky "Reposition()" "Arrakis\Sky"]

[Metadata]
Name=Arrakis | Moon 2
Information=SECOND MOON · MINUTES of the two-moons clock.

[Variables]
@Include=#@#Common.inc

[MeterMoon]
Meter=Image
ImageName=#@#Images\moon_min.png
ToolTipText=SECOND MOON · MINUTES#CRLF#Click to start or stop a focus session
LeftMouseUpAction=[Play "#@#Sounds\#Sounds#\hover.wav"][!CommandMeasure mScript "ToggleFocus()" "Arrakis\Terminal"]
