[Rainmeter]
; Ticks once a second for the clock and cursor; the script redraws only what changed.
Update=1000
DefaultUpdateDivider=-1
AccurateText=1
; the window shrinks to the lines in use
DynamicWindowSize=1
Group=Arrakis
; play the intro, boot after it has faded
OnRefreshAction=[!ActivateConfig "Arrakis\Intro" "Intro.ini"][!Delay 2400][!CommandMeasure mScript "Boot()"]
ContextTitle=Mentat command line
ContextAction=[!CommandMeasure mScript "OpenMentat()"]
ContextTitle2=Kwisatz Haderach mode
ContextAction2=[!CommandMeasure mScript "ToggleKH()"]
ContextTitle3=Reset hidden records
ContextAction3=[!CommandMeasure mScript "ResetSecrets()"]
ContextTitle4=Edit apps and labels
ContextAction4=["notepad.exe" "#@#Variables.inc"]

[Metadata]
Name=Arrakis | Terminal
Information=Boot readout, records, clock, weather, focus timer and the Mentat command line.

[Variables]
@Include=#@#Common.inc
Top=18
LineHeight=18
MentatInput=

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Terminal.lua
UpdateDivider=1

[mProc1]
Measure=Plugin
Plugin=Process
ProcessName=#Rec1Proc#
UpdateDivider=30

[mProc2]
Measure=Plugin
Plugin=Process
ProcessName=#Rec2Proc#
UpdateDivider=30

[mProc3]
Measure=Plugin
Plugin=Process
ProcessName=#Rec3Proc#
UpdateDivider=30

[mProc4]
Measure=Plugin
Plugin=Process
ProcessName=#Rec4Proc#
UpdateDivider=30

[mProc5]
Measure=Plugin
Plugin=Process
ProcessName=#Rec5Proc#
UpdateDivider=30

[mProc6]
Measure=Plugin
Plugin=Process
ProcessName=#Rec6Proc#
UpdateDivider=30

[sLine]
FontFace=#FontUI#
FontSize=10.5
FontColor=#ColText#
AntiAlias=1
StringAlign=LeftCenter
X=10
W=420
H=18
SolidColor=0,0,0,0
MouseActionCursor=0
InlineSetting=CharacterSpacing | 0 | 3 | 0
StringEffect=Shadow
FontEffectColor=#ColShadow#
Group=Lines
Text=
Hidden=1

[Line1]
Meter=String
MeterStyle=sLine
Y=(#Top#+0*#LineHeight#)
MouseOverAction=[!CommandMeasure mScript "Hover(1)"]
MouseLeaveAction=[!CommandMeasure mScript "Leave(1)"]
LeftMouseUpAction=[!CommandMeasure mScript "Click(1)"]

