[Rainmeter]
; Loaded by the Stats skin only while something is downloading; moves itself 25 times a second.
Update=40
DefaultUpdateDivider=-1
Group=Arrakis

[Metadata]
Name=Arrakis | Worm
Information=A sand ripple that travels under the dunes, faster as the download speeds up.

[Variables]
@Include=#@#Common.inc

[mNet]
Measure=NetIn
Interface=Best
UpdateDivider=25

[mWorm]
Measure=Script
ScriptFile=#@#Scripts\Worm.lua
UpdateDivider=1

[MeterWorm]
Meter=Image
ImageName=#@#Images\worm_l.png
