[Rainmeter]
; Invisible controller: wallpaper phase (dawn/day/dusk/night, storm), weather and the moon clock.
Update=10000
DefaultUpdateDivider=-1
Group=Arrakis

[Metadata]
Name=Arrakis | Sky
Information=Switches the wallpaper with the time of day and real weather, and moves the two moons.

[Variables]
@Include=#@#Common.inc

[mWeather]
; Open-Meteo, no account needed. Enabled by the script only when coordinates are set.
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current=temperature_2m,wind_speed_10m&daily=sunrise,sunset&timezone=auto&forecast_days=1
RegExp=(?siU)^(.*)$
UpdateRate=180
UpdateDivider=1
Disabled=1
FinishAction=[!CommandMeasure mSky "WeatherReady()"]

[mSky]
Measure=Script
ScriptFile=#@#Scripts\Sky.lua
UpdateDivider=1

[MeterDot]
Meter=Image
SolidColor=0,0,0,0
W=1
H=1
