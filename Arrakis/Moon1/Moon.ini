[Rainmeter]
; Positioned once a minute by the Sky skin. Click to start or stop a focus session.
Update=-1
Group=Arrakis
OnRefreshAction=[!CommandMeasure mSky "Reposition()" "Arrakis\Sky"]

[Metadata]
Name=Arrakis | Moon 1
Information=FIRST MOON · HOURS of the two-moons clock.

[Variables]
@Include=#@#Common.inc

[MeterMoon]
Meter=Image
ImageName=#@#Images\moon_hour.png
ToolTipText=FIRST MOON · HOURS#CRLF#Click to start or stop a focus session
LeftMouseUpAction=[Play "#@#Sounds\#Sounds#\hover.wav"][!CommandMeasure mScript "ToggleFocus()" "Arrakis\Terminal"]
