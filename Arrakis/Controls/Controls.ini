[Rainmeter]
; Polls the mute state once a second but only redraws when it changes.
Update=1000
DefaultUpdateDivider=-1
AccurateText=1
Group=Arrakis
ContextTitle=Edit apps and labels
ContextAction=["notepad.exe" "#@#Variables.inc"]

[Metadata]
Name=Arrakis | Controls
Information=PROMPT opens the Mentat command line. The ring toggles mute; scroll on it to change volume.

[Variables]
@Include=#@#Common.inc
BtnState=idle
RingState=idle

[mAudio]
Measure=Plugin
Plugin=Win7AudioPlugin
UpdateDivider=1
IfCondition=mAudio < 0
IfTrueAction=[!ShowMeter MeterMuted][!UpdateMeter MeterMuted][!Redraw]
IfFalseAction=[!HideMeter MeterMuted][!UpdateMeter MeterMuted][!Redraw]

[MeterFrame]
Meter=Image
SolidColor=0,0,0,0
W=142
H=43

[MeterButton]
Meter=Image
ImageName=#@#Images\button_#BtnState#.png
X=0
Y=1
DynamicVariables=1

[MeterPrompt]
Meter=String
Text=PROMPT
FontFace=Bahnschrift SemiBold
FontSize=9
FontColor=#ColInk#
AntiAlias=1
StringAlign=CenterCenter
X=52
Y=22
InlineSetting=CharacterSpacing | 0 | 3 | 0

[MeterButtonHit]
Meter=Image
SolidColor=0,0,0,1
X=10
Y=11
W=82
H=21
ToolTipText=Mentat command line. Type ? for help.
MouseOverAction=[!SetVariable BtnState hover][!UpdateMeter MeterButton][!Redraw]
MouseLeaveAction=[!SetVariable BtnState idle][!UpdateMeter MeterButton][!Redraw]
LeftMouseUpAction=[!CommandMeasure mScript "OpenMentat()" "Arrakis\Terminal"]

[MeterRing]
Meter=Image
ImageName=#@#Images\ring_#RingState#.png
X=98
Y=0
DynamicVariables=1

[MeterSpeaker]
Meter=Shape
Shape=Path Tri | Fill Color #ColText# | StrokeWidth 0
Tri=115,21 | LineTo 123,16 | LineTo 123,26 | ClosePath 1

[MeterMuted]
Meter=Shape
Shape=Line 111,29,127,13 | StrokeWidth 2 | Stroke Color #ColText# | StrokeStartCap Round | StrokeEndCap Round
Hidden=1

[MeterRingHit]
Meter=Image
SolidColor=0,0,0,1
X=108
Y=10
W=22
H=22
ToolTipText=Click to mute. Scroll to change volume.
MouseOverAction=[!SetVariable RingState hover][!UpdateMeter MeterRing][!Redraw]
MouseLeaveAction=[!SetVariable RingState idle][!UpdateMeter MeterRing][!Redraw]
LeftMouseUpAction=[!CommandMeasure mAudio "ToggleMute"][!UpdateMeasure mAudio]
MouseScrollUpAction=[!CommandMeasure mAudio "ChangeVolume 4"]
MouseScrollDownAction=[!CommandMeasure mAudio "ChangeVolume -4"]
