[Rainmeter]
; every 2 s: network rates are averaged over the interval anyway
Update=2000
AccurateText=1
Group=Arrakis
ContextTitle=Edit apps and labels
ContextAction=["notepad.exe" "#@#Variables.inc"]

[Metadata]
Name=Arrakis | Stats
Information=Live system readout styled as the poster's billing block.

[Variables]
@Include=#@#Common.inc

; Measures update in file order, so the script comes last and reads fresh values.

[mCPU]
Measure=CPU

[mRAM]
Measure=PhysicalMemory

[mRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[mDiskFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[mNetIn]
Measure=NetIn
Interface=Best

[mNetOut]
Measure=NetOut
Interface=Best

[mUptime]
Measure=Uptime
UpdateDivider=30

[mBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT
UpdateDivider=10

[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE
UpdateDivider=5

[mUser]
Measure=Plugin
Plugin=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1

[mHost]
Measure=Plugin
Plugin=SysInfo
SysInfoType=COMPUTER_NAME
UpdateDivider=-1

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Stats.lua

[MeterFrame]
Meter=Image
SolidColor=0,0,0,0
W=1200
H=40

[sLine]
FontColor=#ColDim#
AntiAlias=1
StringAlign=CenterCenter
X=600
InlineSetting=CharacterSpacing | 0 | 1 | 0
StringEffect=Shadow
FontEffectColor=#ColShadow#

[Line1]
Meter=String
MeterStyle=sLine
FontFace=Bahnschrift SemiLight Condensed
FontSize=10.5
Y=13
Text=

[Line2]
Meter=String
MeterStyle=sLine
MeasureName=mScript
FontFace=Bahnschrift Condensed
FontSize=8.25
Y=29
Text=%1     #Motto#
