[Rainmeter]
; Static apart from the date, bin size and hover states, so it only needs to tick once a minute.
Update=60000
AccurateText=1
Group=Arrakis
ContextTitle=Edit apps and labels
ContextAction=["notepad.exe" "#@#Variables.inc"]

[Metadata]
Name=Arrakis | Title
Information=Credit line, title (click for cinema mode), navigation, tagline, date and footer links.

[Variables]
@Include=#@#Common.inc
Center=500

[mDate]
Measure=Time
Format=%B %#d

[mYear]
Measure=Time
Format=%Y

[mAG]
; Imperial calendar: this year is 10,191 A.G.
Measure=Calc
Formula=([mYear] + 8165)
DynamicVariables=1

[mAGText]
Measure=String
String=[mAG:0]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^(\d+)(\d{3})$":"\1,\2"

[mBin]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Size

[mTitle]
Measure=Script
ScriptFile=#@#Scripts\Title.lua

[MeterFrame]
Meter=Image
SolidColor=0,0,0,0
W=1000
H=300

[sText]
FontFace=#FontUI#
FontColor=#ColText#
AntiAlias=1
StringAlign=CenterCenter
StringEffect=Shadow
FontEffectColor=#ColShadow#

[sLink]
FontFace=Bahnschrift SemiBold
FontColor=#ColDim#
AntiAlias=1
StringAlign=CenterCenter
SolidColor=0,0,0,1
Padding=14,8,14,8
StringEffect=Shadow
FontEffectColor=#ColShadow#
Group=Chrome
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor #ColText#][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor #ColDim#][!UpdateMeter #CURRENTSECTION#][!Redraw]

[sNav]
FontSize=9.75
Y=135
InlineSetting=CharacterSpacing | 0 | 4 | 0

[sFoot]
FontSize=8.25
Y=287
InlineSetting=CharacterSpacing | 0 | 3 | 0

; ---------- credit + title ----------

[MeterCredit]
Meter=String
MeterStyle=sText
Text=#CreditLine#
FontFace=Bahnschrift SemiBold Condensed
FontSize=9
FontColor=#ColDim#
X=#Center#
Y=17
InlineSetting=CharacterSpacing | 0 | 2 | 0
Group=Chrome

[MeterTitle]
Meter=String
MeterStyle=sText
Text=#TitleText#
FontFace=#TitleFont#
FontWeight=#TitleWeight#
FontSize=#TitleSize#
X=(#Center#+#TitleSpacing#/2)
Y=67
SolidColor=0,0,0,1
InlineSetting=CharacterSpacing | 0 | #TitleSpacing# | 0
ToolTipText=Cinema mode
LeftMouseUpAction=[!CommandMeasure mTitle "ToggleCinema()"]

; ---------- navigation ----------

[Nav1]
Meter=String
MeterStyle=sLink | sNav
Text=#Nav1Name#
X=132
LeftMouseUpAction=[#Nav1Cmd#]

[Nav2]
Meter=String
MeterStyle=sLink | sNav
Text=#Nav2Name#
X=266
LeftMouseUpAction=[#Nav2Cmd#]

[Nav3]
Meter=String
MeterStyle=sLink | sNav
Text=#Nav3Name#
X=422
LeftMouseUpAction=[#Nav3Cmd#]

[Nav4]
Meter=String
MeterStyle=sLink | sNav
Text=#Nav4Name#
X=564
LeftMouseUpAction=[#Nav4Cmd#]

[Nav5]
Meter=String
MeterStyle=sLink | sNav
Text=#Nav5Name#
X=692
LeftMouseUpAction=[#Nav5Cmd#]

[Nav6]
Meter=String
MeterStyle=sLink | sNav
Text=#Nav6Name#
X=838
LeftMouseUpAction=[#Nav6Cmd#]

; ---------- tagline + date ----------

[MeterTagline]
Meter=String
MeterStyle=sText
Text=#Tagline#
FontFace=Segoe UI
FontSize=13.5
X=#Center#
Y=173
Group=Chrome

[MeterDate]
Meter=String
MeterStyle=sText
MeasureName=mDate
MeasureName2=mAGText
Text=%1#DateSuffix#
StringCase=Upper
StringStyle=Bold
FontSize=24
X=#Center#
Y=205
InlineSetting=CharacterSpacing | 0 | 1 | 0
; the imperial year after the date is smaller and dimmer
InlineSetting2=Size | 13
InlinePattern2=\s+·.*$
InlineSetting3=Color | #ColDim#
InlinePattern3=\s+·.*$
InlineSetting4=Weight | 600
InlinePattern4=\s+·.*$

; ---------- footer ----------

[Foot1]
Meter=String
MeterStyle=sLink | sFoot
Text=#Foot1Name#
X=237
LeftMouseUpAction=[#Foot1Cmd#]

[Foot2]
Meter=String
MeterStyle=sLink | sFoot
Text=#Foot2Name#
X=386
LeftMouseUpAction=[#Foot2Cmd#]

[Foot3]
; Recycle bin: click opens it, right-click empties it (Windows asks to confirm).
; Emptying runs in EmptyBin.exe so a large bin never blocks Rainmeter.
Meter=String
MeterStyle=sLink | sFoot
MeasureName=mTitle
Text=#Foot3Name#  #Sep#  %1
X=579
ToolTipText=Right-click to empty
LeftMouseUpAction=[!CommandMeasure mBin "OpenBin"]
RightMouseUpAction=["#@#Scripts\EmptyBin.exe"][!Delay 20000][!UpdateMeasure mBin][!UpdateMeasure mTitle][!UpdateMeter Foot3][!Redraw]

[Foot4]
; Theme switch
Meter=String
MeterStyle=sLink | sFoot
Text=#OtherThemeLabel#
X=778
ToolTipText=Switch theme
LeftMouseUpAction=[!CommandMeasure mScript "SwitchTheme('#OtherTheme#')" "Arrakis\Terminal"]
