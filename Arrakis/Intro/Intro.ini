[Rainmeter]
; Loaded by the terminal whenever Rainmeter starts or the theme changes, then unloads itself
; so its full-screen canvas is freed. Click to skip.
Update=-1
AccurateText=1
OnRefreshAction=[!Delay 2300][!HideFade][!Delay 900][!DeactivateConfig]
LeftMouseUpAction=[!HideFade][!Delay 900][!DeactivateConfig]

[Metadata]
Name=Arrakis | Intro
Information=Letterboxed title card at sign-in.

[Variables]
@Include=#@#Common.inc
SW=#SCREENAREAWIDTH#
SH=#SCREENAREAHEIGHT#
Spacing=26

[MeterBg]
Meter=Image
SolidColor=6,3,1,236
W=#SW#
H=#SH#
Group=Intro

[MeterBarTop]
Meter=Image
SolidColor=0,0,0,255
W=#SW#
H=(#SH# * 0.12)
Group=Intro

[MeterBarBottom]
Meter=Image
SolidColor=0,0,0,255
Y=(#SH# * 0.88)
W=#SW#
H=(#SH# * 0.12)
Group=Intro

[MeterTitle]
Meter=String
Text=#IntroTitle#
FontFace=#TitleFont#
FontWeight=#TitleWeight#
FontSize=40
FontColor=#ColText#
AntiAlias=1
StringAlign=CenterCenter
InlineSetting=CharacterSpacing | 0 | #Spacing# | 0
X=(#SW# / 2 + #Spacing# / 2)
Y=(#SH# / 2 - 12)
Group=Intro

[MeterSub]
Meter=String
Text=#IntroSub#
FontFace=Bahnschrift SemiBold
FontSize=9.75
FontColor=#ColDim#
AntiAlias=1
StringAlign=CenterCenter
InlineSetting=CharacterSpacing | 0 | 8 | 0
X=(#SW# / 2 + 4)
Y=(#SH# / 2 + 46)
Group=Intro
