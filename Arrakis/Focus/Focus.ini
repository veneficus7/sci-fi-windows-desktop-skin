[Rainmeter]
; Loaded only during a focus session; the terminal pushes Progress every 10 seconds.
Update=-1
Group=Arrakis

[Metadata]
Name=Arrakis | Focus
Information=Glowing arc that traces around the planet during a focus session.

[Variables]
@Include=#@#Common.inc
Progress=0.002
; window centre = planet centre (975,368) minus the window position (635,28).
; The arc maths stays inline in the shapes: variables built from #Progress# would be frozen at load.
C=340
R=318

[MeterTrack]
Meter=Shape
Shape=Ellipse #C#,#C#,#R#,#R# | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #ColText#,60

[MeterArc]
Meter=Shape
DynamicVariables=1
Shape=Arc #C#,(#C#-#R#),(#C# + #R# * Sin(#Progress# * 2 * PI)),(#C# - #R# * Cos(#Progress# * 2 * PI)),#R#,#R#,0,0,(#Progress# > 0.5 ? 1 : 0) | StrokeWidth 10 | Stroke Color #ColSpice#,40 | StrokeStartCap Round | StrokeEndCap Round | Fill Color 0,0,0,0
Shape2=Arc #C#,(#C#-#R#),(#C# + #R# * Sin(#Progress# * 2 * PI)),(#C# - #R# * Cos(#Progress# * 2 * PI)),#R#,#R#,0,0,(#Progress# > 0.5 ? 1 : 0) | StrokeWidth 5 | Stroke Color #ColSpice#,110 | StrokeStartCap Round | StrokeEndCap Round | Fill Color 0,0,0,0
Shape3=Arc #C#,(#C#-#R#),(#C# + #R# * Sin(#Progress# * 2 * PI)),(#C# - #R# * Cos(#Progress# * 2 * PI)),#R#,#R#,0,0,(#Progress# > 0.5 ? 1 : 0) | StrokeWidth 2 | Stroke Color #ColText#,255 | StrokeStartCap Round | StrokeEndCap Round | Fill Color 0,0,0,0

[MeterHead]
Meter=Shape
DynamicVariables=1
Shape=Ellipse (#C# + #R# * Sin(#Progress# * 2 * PI)),(#C# - #R# * Cos(#Progress# * 2 * PI)),11 | Fill Color #ColSpice#,60 | StrokeWidth 0
Shape2=Ellipse (#C# + #R# * Sin(#Progress# * 2 * PI)),(#C# - #R# * Cos(#Progress# * 2 * PI)),4.5 | Fill Color #ColText#,255 | StrokeWidth 0
